<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع التواصل</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 450px;
            padding: 20px;
        }
        img {
            max-width: 100%;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            resize: none;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }
        button {
            background-color: #333;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- صورة الورد الخاصة بك -->
    <img src="https://lh3.googleusercontent.com/pw/AP1GczMcVqL2t6-T5XzM_U7J-S6l7Yp6Bv8Rz-u1_O5H6x_9-K_6w=w1000" alt="Bouquet">

    <!-- الرابط الصحيح اللي أرسلته أنت -->
    <form action="https://formspree.io/f/xpqbylov" method="POST">
        <textarea name="message" placeholder="اكتب رسالتك هنا..." required></textarea>
        <button type="submit">إرسال</button>
    </form>
</div>

</body>
</html>
